<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Salem</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-red-950 text-white overflow-hidden font-['Space_Grotesk']">
  <div id="root"></div>

  <script type="text/babel">
    function App() {
      return (
        <div className="relative min-h-screen bg-red-950 text-white overflow-hidden flex items-center justify-center">
          <div className="absolute inset-0 flex items-center justify-center">
            <div className="w-[500px] h-[500px] bg-white/10 blur-3xl rounded-full"></div>
          </div>

          <h1 className="relative z-10 text-4xl md:text-[6rem] font-black uppercase tracking-[0.04em] text-white select-none max-w-[88vh]">
            Salem
          </h1>

          {/* footer */}
          <div className="absolute bottom-6 left-1/2 -translate-x-1/2 text-white/40 text-xs tracking-[0.3em] uppercase text-center">
            © 1999 - 2026 | All Rights Reserved | Salem
          </div>
        </div>
      )
    }

    const root = ReactDOM.createRoot(document.getElementById('root'))
    root.render(<App />)
  </script>
</body>
</html>
