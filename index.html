<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Salem — Different Minds. One Family. Explore projects from the Salem family.">
  <meta property="og:title" content="Salem — Different Minds. One Family.">
  <meta property="og:description" content="Family, projects and creations.">
  <meta property="og:type" content="website">
  <link rel="icon" href="assets/salem-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <title>Salem — Family & Projects</title>
  <style>
    :root {color-scheme:dark;--background:#080808;--foreground:#f7f7f5;--muted:#999}
    *,*::before,*::after {box-sizing:border-box}
    html,body {height:100%;width:100%;margin:0;background:var(--background);overflow:hidden}
    body {font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--foreground);-webkit-font-smoothing:antialiased}
    a {color:inherit;text-decoration:none}
    a:focus-visible {outline:2px solid white;outline-offset:8px;border-radius:5px}
    ::selection {background:#fff;color:#080808}
    .page {min-height:0;height:100vh;height:100dvh;max-width:100%;display:flex;align-items:center;flex-direction:column;position:relative;isolation:isolate;overflow:hidden}
    .page::before {content:"";position:absolute;z-index:-1;pointer-events:none;inset:25% -10% 3%;background:radial-gradient(ellipse at 50% 46%,rgba(255,255,255,.05),transparent 63%)}
    .navigation {position:absolute;z-index:4;top:clamp(8px,2vh,20px);left:clamp(14px,3vw,36px);display:flex;align-items:center;justify-content:flex-start;width:max-content;min-height:58px;padding:0;border:0;border-radius:0;background:transparent;box-shadow:none}
    .brand {font-weight:800;letter-spacing:-.095em;font-size:22px;line-height:1;white-space:nowrap}
    .brand .dot {color:#858585}
    .stage {width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(100px,15vh,150px) 0 55px;gap:clamp(52px,9vh,96px)}
    .marquee {width:100%;overflow:hidden;position:relative;flex:none;padding:18px 0;mask-image:linear-gradient(to right,transparent 0%,black 10%,black 90%,transparent 100%);-webkit-mask-image:linear-gradient(to right,transparent 0%,black 10%,black 90%,transparent 100%)}
    .marquee-track {display:flex;align-items:center;width:max-content;animation:travel 36s linear infinite;will-change:transform}
    .marquee:hover .marquee-track,.marquee:focus-within .marquee-track {animation-play-state:paused}
    .marquee-set {display:flex;align-items:center;gap:clamp(80px,10vw,180px);padding-right:clamp(80px,10vw,180px);flex:none}
    .logo-item {display:flex;align-items:center;justify-content:center;min-width:clamp(90px,9vw,130px);width:max-content;height:clamp(86px,10vw,140px);flex:none}
    .logo-item img {width:clamp(65px,7.2vw,105px);height:clamp(65px,7.2vw,105px);display:block;object-fit:contain;transition:transform .3s ease,opacity .3s ease;opacity:.92}
    .logo-item:hover img {transform:scale(1.1);opacity:1}
    .logo-item.brand-lockup {gap:clamp(12px,1.7vw,24px);min-width:0}
    .logo-item .brand-name {font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:clamp(32px,4vw,56px);font-weight:650;letter-spacing:-.075em;line-height:1;white-space:nowrap;color:#f6f6f6;transition:transform .3s ease}
    .logo-item:hover .brand-name {transform:scale(1.04)}
    .brand-lockup.the32 .brand-name {font-weight:800;letter-spacing:-.07em}
    @keyframes travel {from {transform:translate3d(0,0,0)}to {transform:translate3d(-50%,0,0)}}
    .copy {text-align:center;padding:0 24px;max-width:930px}
    h1 {margin:24px 0 15px;font-size:clamp(38px,5.3vw,73px);line-height:1.14;letter-spacing:-.073em;font-weight:750}
    h1 em {font-family:Georgia,Times New Roman,serif;letter-spacing:-.065em;font-weight:400}
    .footer {position:absolute;bottom:clamp(18px,4vh,35px);left:clamp(24px,6vw,90px);right:clamp(24px,6vw,90px);display:flex;justify-content:space-between;align-items:center;gap:20px;font-size:10px;color:#777;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
    .sr-only {position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:720px){
      .navigation {left:14px;min-height:51px;padding:0}
      .brand {font-size:20px}
      .stage {gap:clamp(28px,5vh,65px);padding:120px 0 65px}
      .marquee {padding:3px 0}
      .marquee-set {gap:75px;padding-right:75px}
      .logo-item {min-width:72px;height:90px}
      .logo-item img {width:63px;height:63px}
      .logo-item.brand-lockup {gap:10px}
      .logo-item .brand-name {font-size:31px}
      .brand-lockup.the32 .brand-name {font-size:30px}
      h1 {font-size:clamp(34px,9vw,55px);margin:18px 0 10px}
      .footer {font-size:8px;left:22px;right:22px;bottom:21px}
    }
    @media(max-height:550px){
      .navigation {top:8px;min-height:46px}
      .stage {padding:76px 0 38px;gap:10px}
      .marquee {padding:0}
      .logo-item {height:68px}
      .logo-item img {width:55px;height:55px}
      .logo-item .brand-name,.brand-lockup.the32 .brand-name {font-size:24px}
      h1 {font-size:clamp(29px,5vh,45px);margin:10px 0 5px}
      .footer {bottom:8px}
    }
    @media(prefers-reduced-motion:reduce){
      .marquee-track {animation:none;will-change:auto}
      .logo-item img,.logo-item .brand-name {transition:none}
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="navigation" aria-label="Site header">
      <span class="brand" aria-label="Salem">salem<span class="dot">.</span></span>
    </header>
    <main class="stage">
      <section class="marquee" aria-label="Salem projects: Mondoo, THE32, Roya, Noqta">
        <div class="marquee-track" aria-hidden="true">
          <div class="marquee-set">
            <span class="logo-item brand-lockup"><img src="assets/mondoo.svg" alt="" width="512" height="512"><span class="brand-name">mondoo</span></span>
            <span class="logo-item brand-lockup the32"><img src="assets/the32.svg" alt="" width="150" height="150"><span class="brand-name">THE32</span></span>
            <span class="logo-item"><span class="brand-name">Roya</span></span>
            <span class="logo-item"><span class="brand-name">Noqta</span></span>
          </div>
          <div class="marquee-set">
            <span class="logo-item brand-lockup"><img src="assets/mondoo.svg" alt="" width="512" height="512"><span class="brand-name">mondoo</span></span>
            <span class="logo-item brand-lockup the32"><img src="assets/the32.svg" alt="" width="150" height="150"><span class="brand-name">THE32</span></span>
            <span class="logo-item"><span class="brand-name">Roya</span></span>
            <span class="logo-item"><span class="brand-name">Noqta</span></span>
          </div>
        </div>
      </section>
      <section class="copy" aria-labelledby="page-title">
        <h1 id="page-title">Different Minds. <em>One Family.</em></h1>
      </section>
      <div class="sr-only">Featured projects: Mondoo, a creative workspace at <a href="https://mondoo.ly">mondoo.ly</a>; THE32, creative tools and visual experiments; Roya; and Noqta.</div>
    </main>
    <footer class="footer">
      <span>SALEM © 2026</span>
      <span>ROOTED IN LIBYA · BUILT FOR THE WORLD</span>
    </footer>
  </div>
</body>
</html>
